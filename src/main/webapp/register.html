<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: #0b0c10; /* Premium deep black background */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
}

/* Container with entry animation and glassmorphism styling */
.container {
    width: 100%;
    max-width: 420px;
    background: #1f2833; /* Dark slate surface */
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 50px rgba(255, 71, 87, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.04);
    animation: fadeInContainer 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    opacity: 0;
    transform: translateY(20px);
}

@keyframes fadeInContainer {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #ffffff;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.input-group {
    margin-bottom: 20px;
    position: relative;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #a8b2c1; /* Muted silver/gray text */
    font-size: 14px;
    transition: color 0.3s ease;
}

input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    outline: none;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

/* Interactive Input Focus State */
input:focus {
    background: rgba(255, 255, 255, 0.07);
    border-color: #ff4757; /* Accent neon red border */
    box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.15);
}

/* Custom highlight for labels when their inputs are focused */
.input-group:focus-within label {
    color: #ff4757;
}

/* Modern styling overrides for native date picker in dark mode */
input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
}

button {
    width: 100%;
    padding: 14px;
    background: #ff4757; /* Vivid neon red */
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    margin-top: 10px;
}

button:hover {
    background: #e23744;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5);
}

button:active {
    transform: translateY(0);
}

p {
    text-align: center;
    margin-top: 25px;
    color: #a8b2c1;
    font-size: 14px;
}

a {
    text-decoration: none;
    color: #ff4757;
    font-weight: 600;
    transition: color 0.25s ease;
    margin-left: 4px;
}

a:hover {
    color: #e23744;
    text-decoration: underline;
}
</style>

</head>
<body>

<div class="container">

<h2>Register</h2>

<form action="RegisterServlet" method="post">

    <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="name" required>
    </div>

    <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <div class="input-group">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" required>
    </div>

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" name="phone_number"
               pattern="[0-9]{10}"
               maxlength="10"
               placeholder="Enter 10-digit phone number"
               required>
    </div>

    <button type="submit">Register</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
